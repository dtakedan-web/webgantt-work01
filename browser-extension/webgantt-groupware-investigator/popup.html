<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>WebGantt グループウェア調査ツール</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
    width: 420px;
    margin: 0;
    padding: 16px;
    color: #222;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 4px 0;
  }
  .warn {
    background: #fff4e5;
    border: 1px solid #f0c36d;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    color: #7a4a00;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin: 6px 0;
    padding: 6px 10px;
    background: #f5f6f8;
    border-radius: 6px;
  }
  .stat-row .label { color: #555; }
  .stat-row .value { font-weight: bold; }
  button {
    display: block;
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  button.primary {
    background: #2f6fed;
    color: #fff;
  }
  button.primary:hover { background: #2559c4; }
  button.secondary {
    background: #eee;
    color: #333;
  }
  button.secondary:hover { background: #ddd; }
  button.danger {
    background: #fff;
    color: #c0392b;
    border: 1px solid #c0392b;
  }
  button.danger:hover { background: #fdecea; }
  #msg {
    margin-top: 10px;
    font-size: 12px;
    color: #2a7a2a;
    min-height: 16px;
  }
  #msg.error { color: #c0392b; }
  .hint {
    font-size: 11px;
    color: #777;
    margin-top: 12px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <h1>WebGantt グループウェア調査ツール</h1>
  <div class="warn">
    これは設計調査専用の一時ツールです。社内グループウェア画面で発生する
    通信内容(Ajax/XHR)とカレンダー部分のHTML構造をこの拡張機能内(端末上)に
    記録します。データは外部に送信されません。調査完了後は削除して構いません。
  </div>

  <div class="stat-row">
    <span class="label">記録件数</span>
    <span class="value" id="recordCount">-</span>
  </div>
  <div class="stat-row">
    <span class="label">うち通信ログ(fetch/XHR)</span>
    <span class="value" id="networkCount">-</span>
  </div>
  <div class="stat-row">
    <span class="label">うちDOMスナップショット</span>
    <span class="value" id="domCount">-</span>
  </div>

  <button id="downloadBtn" class="primary">記録をJSONファイルとしてダウンロード</button>
  <button id="refreshBtn" class="secondary">件数を更新</button>
  <button id="clearBtn" class="danger">記録をクリア</button>

  <div id="msg"></div>

  <div class="hint">
    使い方: グループウェアのカレンダー画面を開いて操作(週の切り替えなど)すると、
    自動的に記録されます。ある程度操作したら「ダウンロード」を押してファイルを
    保存し、そのファイルをチャットにアップロードしてください。
  </div>

  <script src="popup.js"></script>
</body>
</html>
